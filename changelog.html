  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }

<script type="application/json" id="data">{"format":1,"versions":{"1":{"created":"2026-10-06T08:23:10.163Z","branch":"main","commit":"177fde9","message":"Update Readme","text":{"default":"# A new era for Settlers 4 updates\n\nThe Settlers United mod files for Settlers IV now have a home of their own: balancing, plugin and everything that goes with it reach you **independently of the launcher** – no launcher update, no reinstall.\n\n**This version corresponds to the current live version 0.9.265.**\n\n# What changes for you\n\n- **Faster independent S4-updates:** New balancing changes and plugin versions are there at your next start.\n- **Versions:** Select the version you like in \"Create new game\" and in the Launcher-settings (Settlers IV, Tools) and choose between 'Stable' or 'Preview' to test upcoming changes before everyone else.\n- **Secure:** All files are signed and verified before installation.\n\nThis is the starting shot. It's going to get exciting. 🚀"}},"2":{"created":"2026-10-14T09:58:19.378Z","branch":"preview","commit":"412fb71","message":"update preview","text":{"default":"# First Preview\nThis is a first test to see the system working."}},"3":{"created":"2026-10-14T18:59:34.690Z","branch":"Preview","commit":"4c3582d","message":"update preview","text":{"default":"# Second Preview\nFirst change here."}},"4":{"created":"2026-10-20T17:38:16.505Z","branch":"Preview","commit":"f60058d","message":"update preview","text":{"default":"Adds the HookRegistry: detects overlaps and address reusages as well as external hooks and patches based on a comparison to the local original unpatched exe."}},"5":{"created":"2026-10-21T07:02:47.834Z","branch":"Preview","commit":"5d4c661","message":"update preview","text":{"default":"Fix HookRegistry detections and DebugOverlay-crashes in combination with SU."}},"6":{"created":"2026-10-25T10:46:09.171Z","branch":"Preview","commit":"5672198","message":"update preview","text":{"default":"# Notes\nAs this is a very huge overhaul of the previous patches, there are still some **things to improve here**. If you find anything not quite intuitive (e.g. descriptions) or know a better solution for, **let me know on Discord** :D\n\n\n# Fixed\n- No FE but a warning instead if you join a game and do not have the correct map locally (see section Added for *Automatic Map and Script Exchange*).\n- Fixed a FE at the lobby screen when changing the balancing option.\n- Tutorial-events stayed active in lobby, leading to FEs when e.g. pressing space.\n- Better Chat Symbols: now working for initial messages as well.\n- Ferry unloading: checks properly for ground type, avoiding Entities being stuck on water.\n- Advanced Chat Commands are now properly sent and executed on every machine in parallel avoiding Desyncs (except for the explicit keyword 'local').\n- Fixed speed of entities on pathways, they were off by one.\n- Hotkeys keep working after changing player mid-game.\n- Rightclick now copies the proper chat message (it often took the wrong line).\n- SULib: SU.GameData.Set-Functions now clamp the parameter instead of modulo (e.g. 256 -> 255 instead of 0).\n\n\n# Added\n- Balancing-files are reloaded at every single map-start to prevent desyncs due to old settings (e.g. a player with who played UBO joins now UBO-Test).\n- Added CRC-checks inside the lobby and at game-start, checking all balancing relevant things (Maps, Files, Scripts, Settings) -> find mismatching settings before playing.\n- Invite-button: a menu shows up listing all your Ubisoft friends to directly invite them into your game.\n- Ferry instant unloader. Note that vehicles might still be in there, as they would usually be spawned at last (furthest away), which might not always be desired as they are kind of unprotected there - can be adjusted if wanted.\n- Player-change updates the GUI as well. Note that texts are not updated yet.\n\n- **Workingarea for big temples** let priest go there automatically.\n\n- **Automatic Map and Script Exchange**: when you join a game, the map and script (internal and external ones!) are both checked and if not existent on your machine automatically downloaded directly from the host - no need to exchange any maps/scripts anymore!\n\n- **PioneerPath**: you can now let pioneers capture a path from A to B automatically. It's by design a bit wider than needed with some natural variations s.t. micromanaging is still quicker. You can start it **via GUI** or **Shift+rightclicking** the selected ones from their mean position the the mouse coordinate.\n\n- **Geologists variable precision**: you can define the precision (coarse, normal, fine) of geologists **via GUI** or by **Ctrl(coarse) / Shift(fine) + rightclicking**.\n\n- **Replay-System**: for now it's only there **for debugging** and there are a few known bugs, so use at own risk!\n\n\n# Changed\n- **Refactoring**: this is a huge refactoring, **checking every single patch/mod** once again, rewriting some, making it much easier to extend and add new ones and improving the overall **game stability** a lot. As there might still be **some bugs left**, these nice features stay in **Preview for now**."}}},"releases":{"main":{"current":1,"versions":[{"version":1,"at":"2026-10-06T08:23:10.163Z"}]},"Preview":{"current":6,"versions":[{"version":6,"at":"2026-10-25T10:46:09.173Z"},{"version":5,"at":"2026-10-21T07:02:47.835Z"},{"version":4,"at":"2026-10-20T17:38:16.506Z"},{"version":3,"at":"2026-10-14T18:59:34.692Z"},{"version":2,"at":"2026-10-14T17:30:44.218Z"}]}},"seq":12,"updated":"2026-10-25T11:09:11.284Z"}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var tabsEl = document.getElementById('tabs'), listEl = document.getElementById('list');
  var qEl = document.getElementById('q'), langEl = document.getElementById('lang');
  var names = Object.keys(data.releases).sort(function (a, b) { return a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b); });
  var PALETTE = ['#fb8c00', '#1e88e5', '#8e24aa', '#d81b60', '#00897b', '#6d4c41', '#7cb342', '#5e35b1'];
  var color = function (n) { if (n === 'main') return '#43a047'; var o = names.filter(function (x) { return x !== 'main'; }).sort(); return PALETTE[Math.max(0, o.indexOf(n)) % PALETTE.length]; };
  var label = function (n) { return n === 'main' ? 'Stable' : n.charAt(0).toUpperCase() + n.slice(1); };
  var params = new URLSearchParams(location.search);
  var tab = params.get('release') || (names.indexOf('main') >= 0 ? 'main' : names[0]) || 'all';
  langEl.value = params.get('lang') || ((navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en');
  qEl.value = params.get('q') || '';
  var focus = (location.hash.match(/^#v(\d+)$/) || [])[1];

  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(langEl.value === 'de' ? 'de-DE' : 'en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function textOf(v) { var t = (data.versions[v] || {}).text || {}; return t[langEl.value] || t.default || t.en || t.de || ''; }
  function inline(parent, s) {
    s.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(function (part) {
      if (!part) return;
      var el = null;
      if (part.slice(0, 2) === '**' && part.slice(-2) === '**' && part.length > 4) { el = document.createElement('strong'); el.textContent = part.slice(2, -2); }
      else if (part[0] === '`' && part.slice(-1) === '`' && part.length > 2) { el = document.createElement('code'); el.textContent = part.slice(1, -1); }
      parent.appendChild(el || document.createTextNode(part));
    });
  }
  function markdown(parent, md) {
    var ul = null, p = null;
    md.split('\n').forEach(function (line) {
      var item = /^\s*[-*]\s+(.*)$/.exec(line);
      var head = /^#+\s+(.*)$/.exec(line);
      if (head) { ul = null; p = null; var h = document.createElement('h4'); inline(h, head[1]); parent.appendChild(h); return; }
      if (item) { p = null; if (!ul) { ul = document.createElement('ul'); parent.appendChild(ul); } var li = document.createElement('li'); inline(li, item[1]); ul.appendChild(li); }
      else if (!line.trim()) { ul = null; p = null; }
      else { ul = null; if (!p) { p = document.createElement('p'); parent.appendChild(p); } else p.appendChild(document.createElement('br')); inline(p, line.replace(/^#+\s*/, '')); }
    });
  }
  function rows() {
    if (tab === 'all') return Object.keys(data.versions).map(Number).sort(function (a, b) { return b - a; }).map(function (v) { return { version: v, at: data.versions[v].created }; });
    return ((data.releases[tab] || {}).versions || []);
  }
  function releasesOf(v) {
    return names.map(function (n) { var e = (data.releases[n].versions || []).filter(function (x) { return x.version === v; })[0]; return e ? { name: n, at: e.at } : null; })
      .filter(Boolean).sort(function (a, b) { return a.at.localeCompare(b.at); });
  }
  function render() {
    tabsEl.textContent = '';
    ['all'].concat(names).forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(n === tab));
      b.textContent = n === 'all' ? 'All versions' : label(n);
      if (n === 'all') b.className = 'all';
      b.onclick = function () { tab = n; render(); }; tabsEl.appendChild(b);
    });
    var q = qEl.value.trim().toLowerCase().replace(/^v/, '');
    listEl.textContent = '';
    var shown = 0;
    rows().forEach(function (r) {
      var v = data.versions[r.version] || {}, text = textOf(r.version);
      var haystack = (r.version + ' ' + (v.message || '') + ' ' + text).toLowerCase();
      if (q && haystack.indexOf(q) < 0) return;
      shown++;
      var art = document.createElement('article'); art.id = 'v' + r.version; if (String(r.version) === focus) art.className = 'hl';
      var h = document.createElement('h2'), a = document.createElement('a'); a.href = '#v' + r.version; a.textContent = 'Version ' + r.version; h.appendChild(a);
      var curOf = tab !== 'all' ? (data.releases[tab].current === r.version ? tab : null) : (names.filter(function (n) { return data.releases[n].current === r.version; })[0] || null);
      if (curOf) { art.className += (art.className ? ' ' : '') + 'cur'; art.style.setProperty('--cur', color(curOf)); }
      var meta = document.createElement('div'); meta.className = 'meta';
      var rel = releasesOf(r.version);
      rel.forEach(function (x) {
        var t = document.createElement('span'), now = data.releases[x.name].current === r.version;
        t.className = 'tag' + (now ? ' on' : ''); t.textContent = label(x.name);
        t.style.color = color(x.name); if (now) t.style.background = color(x.name);
        t.title = label(x.name) + (now ? ' (current) ' : ' (replaced) ') + fmt(x.at);
        meta.appendChild(t); meta.appendChild(document.createTextNode(fmt(x.at) + '  '));
      });
      if (!rel.length) meta.textContent = 'not released (built ' + fmt(v.created) + ')';
      art.appendChild(h); art.appendChild(meta);
      if (text) markdown(art, text); else if (v.message) { var m = document.createElement('p'); m.textContent = v.message; art.appendChild(m); }
      listEl.appendChild(art);
    });
    if (!shown) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No matching versions.'; listEl.appendChild(e); }
    if (focus) { var t = document.getElementById('v' + focus); if (t) t.scrollIntoView(); focus = null; }
  }
  if (focus) { var home = names.filter(function (n) { return releasesOf(Number(focus)).some(function (x) { return x.name === n; }); })[0]; if (home && !params.get('release')) tab = home; else if (!home) tab = 'all'; }
  qEl.oninput = render; langEl.onchange = render; window.onhashchange = function () { focus = (location.hash.match(/^#v(\d+)$/) || [])[1]; render(); };
  render();
})();
</script>
