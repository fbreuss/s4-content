<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settlers United S4 content changelog</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --bg:#fff; --muted:#6e6e73; --line:#d2d2d7; --accent:#3b6fd4; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --bg:#16181d; --muted:#9a9aa3; --line:#33363d; --accent:#7ea6ee; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; }
  button, input, select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; }
  button.all { margin-right:14px; position:relative; }
  button.all::after { content:""; position:absolute; right:-11px; top:15%; bottom:15%; width:1px; background:currentColor; opacity:.35; }
  button[aria-selected="true"] { border-color:var(--accent); color:var(--accent); }
  input { flex:1; min-width:160px; }
  article { border-top:1px solid var(--line); border-left:4px solid transparent; padding:18px 14px; }
  article.hl { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  h2 { font-size:30px; font-weight:700; line-height:1.2; margin:0 0 6px; }
  h4 { font-size:18px; font-weight:700; line-height:1.3; margin:16px 0 4px; }
  h2 a { color:inherit; text-decoration:none; }
  .meta { color:var(--muted); font-size:13px; margin:2px 0 6px; }
  .tag { display:inline-block; border:1px solid currentColor; border-radius:4px; padding:1px 10px; font-size:14px; font-weight:700; letter-spacing:.02em; margin-right:8px; vertical-align:middle; }
  .tag.on { color:#fff !important; }
  article.cur { background:color-mix(in srgb, var(--cur) 14%, transparent); border-left-color:var(--cur); border-radius:0 6px 6px 0; }
  .legend { color:var(--muted); font-size:13px; margin:-6px 0 10px; }
  p { margin:6px 0; } ul { margin:6px 0; padding-left:22px; } code { background:color-mix(in srgb, var(--muted) 20%, transparent); padding:0 4px; border-radius:3px; }
  .empty { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<main>
<h1>S4 content changelog</h1>
<div class="bar">
  <div class="tabs" id="tabs" role="tablist"></div>
  <input id="q" type="search" placeholder="Search version or text" aria-label="Search">
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select>
</div>
<div class="legend">The highlighted entry is the version a release currently points to.</div>
<div id="list"></div>
</main>
<script type="application/json" id="data">{"format":1,"versions":{"1":{"created":"2026-10-06T08:23:10.163Z","branch":"main","commit":"177fde9","message":"Update Readme","text":{"default":"# A new era for Settlers 4 updates\n\nThe Settlers United mod files for Settlers IV now have a home of their own: balancing, plugin and everything that goes with it reach you **independently of the launcher** – no launcher update, no reinstall.\n\n**This version corresponds to the current live version 0.9.265.**\n\n# What changes for you\n\n- **Faster independent S4-updates:** New balancing changes and plugin versions are there at your next start.\n- **Versions:** Select the version you like in \"Create new game\" and in the Launcher-settings (Settlers IV, Tools) and choose between 'Stable' or 'Preview' to test upcoming changes before everyone else.\n- **Secure:** All files are signed and verified before installation.\n\nThis is the starting shot. It's going to get exciting. 🚀"}},"2":{"created":"2026-10-14T09:58:19.378Z","branch":"preview","commit":"412fb71","message":"update preview","text":{"default":"# First Preview\nThis is a first test to see the system working."}},"3":{"created":"2026-10-14T18:59:34.690Z","branch":"Preview","commit":"4c3582d","message":"update preview","text":{"default":"# Second Preview\nFirst change here."}},"4":{"created":"2026-10-20T17:38:16.505Z","branch":"Preview","commit":"f60058d","message":"update preview","text":{"default":"Adds the HookRegistry: detects overlaps and address reusages as well as external hooks and patches based on a comparison to the local original unpatched exe."}},"5":{"created":"2026-10-21T07:02:47.834Z","branch":"Preview","commit":"5d4c661","message":"update preview","text":{"default":"Fix HookRegistry detections and DebugOverlay-crashes in combination with SU."}},"6":{"created":"2026-10-25T10:46:09.171Z","branch":"Preview","commit":"5672198","message":"update preview","text":{"default":"# Notes\nAs this is a very huge overhaul of the previous patches, there are still some **things to improve here**. If you find anything not quite intuitive (e.g. descriptions) or know a better solution for, **let me know on Discord** :D\n\n\n# Fixed\n- No FE but a warning instead if you join a game and do not have the correct map locally (see section Added for *Automatic Map and Script Exchange*).\n- Fixed a FE at the lobby screen when changing the balancing option.\n- Tutorial-events stayed active in lobby, leading to FEs when e.g. pressing space.\n- Better Chat Symbols: now working for initial messages as well.\n- Ferry unloading: checks properly for ground type, avoiding Entities being stuck on water.\n- Advanced Chat Commands are now properly sent and executed on every machine in parallel avoiding Desyncs (except for the explicit keyword 'local').\n- Fixed speed of entities on pathways, they were off by one.\n- Hotkeys keep working after changing player mid-game.\n- Rightclick now copies the proper chat message (it often took the wrong line).\n- SULib: SU.GameData.Set-Functions now clamp the parameter instead of modulo (e.g. 256 -> 255 instead of 0).\n\n\n# Added\n- Balancing-files are reloaded at every single map-start to prevent desyncs due to old settings (e.g. a player with who played UBO joins now UBO-Test).\n- Added CRC-checks inside the lobby and at game-start, checking all balancing relevant things (Maps, Files, Scripts, Settings) -> find mismatching settings before playing.\n- Invite-button: a menu shows up listing all your Ubisoft friends to directly invite them into your game.\n- Ferry instant unloader. Note that vehicles might still be in there, as they would usually be spawned at last (furthest away), which might not always be desired as they are kind of unprotected there - can be adjusted if wanted.\n- Player-change updates the GUI as well. Note that texts are not updated yet.\n- Saboteurs can attack Ports and Shipyards properly.\n- Spell 'Attack out of Nowhere' now prioritizes entities in the following order: (first) squadleader, swordman, racespecial, bowman, rest (last).\n\n- **Attack canceling fix**: damage is now always applied at the end of an animation, even when given a new movement command in the meantime.\n\n- **Workingarea for big temples** let priest go there automatically.\n\n- **Automatic Map and Script Exchange**: when you join a game, the map and script (internal and external ones!) are both checked and if not existent on your machine automatically downloaded directly from the host - no need to exchange any maps/scripts anymore!\n\n- **PioneerPath**: you can now let pioneers capture a path from A to B automatically. It's by design a bit wider than needed with some natural variations s.t. micromanaging is still quicker. You can start it **via GUI** or **Shift+rightclicking** the selected ones from their mean position the the mouse coordinate.\n\n- **Geologists variable precision**: you can define the precision (coarse, normal, fine) of geologists **via GUI** or by **Ctrl(coarse) / Shift(fine) + rightclicking**.\n\n- **Replay-System**: for now it's only there **for debugging** and there are a few known bugs, so use at own risk!\n\n\n# Changed\n- **Refactoring**: this is a huge refactoring, **checking every single patch/mod** once again, rewriting some, making it much easier to extend and add new ones and improving the overall **game stability** a lot. As there might still be **some bugs left**, these nice features stay in **Preview for now**."}},"7":{"created":"2026-10-25T16:14:58.548Z","branch":"Preview","commit":"b171bd6","message":"update preview balancing","text":{"default":"Update Balancing UBO-Test to 4.0.7 of Launcher Release 0.9.265."}},"8":{"created":"2026-11-04T07:55:06.344Z","branch":"Preview","commit":"524445d","message":"update preview (plugin, ingame-ui, hotkeysGUI, changelog)","text":{"default":"# Fixed\n- Implemented experimental changes (these are only enabled for UBO-TEST and Tournament lobbies):\n\t- Fixes the working area visualization of Big Temples.\n\t- **Damaged entity lists**: fixes lost goods and settlers and the crashes they caused. Already broken savegames are repaired automatically. (**many thanks to pikechu**)\n\t- Empty storage slots are free again, even if carriers were still on their way.\n\t- The X key opens the resource priorities even if the production tab wasn't open yet.\n\t- Fixes greying out of menu buttons.\n- Lobby:\n\t- Fixes some crashes when different Release-Versions try to join each other directly in the game. Remember to **join via SU** instead of in-game multiplayer menu!\n\t- Removes hardcoded 'thesettlers4' from script paths, but adds a proper installation-path check. This means you can install S4 in any folder you like - you probably shouldn't though...\n\t- Hides the script not present warning at statistic screens.\n\t- Mapnames of campaigns are now properly displayed.\n\t- History lobbies, singleplayer and campaign use the original files again. Leftovers of an earlier UBO game caused desyncs in History lobbies.\n\t- Random maps no longer end the game with a file error at the map transfer.\n\t- No more crash when leaving a lobby after the host left.\n- Fixes missing texts in menus.\n- Hotkeys only react if S4 is really in the foreground and no longer crash after a GUI reload.\n- Taking land via SU-Lua with an explicit player ID no longer desyncs.\n- UBO lobbies: a defeated host can send SU events again.\n\n\n# Added\n- Implemented experimental changes (these are only enabled for UBO-TEST and Tournament lobbies):\n\t- **Toolsmith order list**: tools are made in the order you ordered them instead of alternating. The wider menu shows the list of the sector, where you can move and remove entries. It can be switched off per sector.\n\t- **Settings at construction sites**: storages, tool- and weaponsmiths, barracks, vehicle halls, shipyards, ports and marketplaces can already be set up during construction.\n\t- **Range displays**: range of priests, area of spells, land of towers at placement and shot range of soldiers in military buildings. All are off by default: enable them in the launcher, the HD menu or via hotkeys, or just hold **Ctrl** (except for tower land). This also shows the range of the priest or military building under the mouse, even of enemies, but not in the fog.\n\t- **Buildings**: finished buildings heal 1 HP every 45 ticks, all damaged buildings show smoke and the building menu shows an HP bar. **Smoke positions are WIP**.\n\t- **Vehicles**:\n\t\t- carts load faster\n\t\t- **War machines, carts and donkeys get through crowds way faster**.\n\t\t- **Settlers walk around vehicles**.\n\t- **Tools**: workers drop their tool when they die or when their building is destroyed.\n\t- **Gold goes to construction sites first**: as long as one requests gold, the barracks of its sector don't get any.\n\t- Viking spells 'Freeze enemies' and 'Fear' now also affect enemy priests.\n\t- Option: Allied AI no longer takes land from human teammates.\n\t- **Pause: move the view** with the right mouse button and zoom with the mouse wheel. In multiplayer the host can pause with the pause key if game speed is changeable in the lobby.\n\t- The settler overview shows donkeys, the settler search also finds donkeys, carts, war machines and ships.\n\t- Chat message if a hunter finds no animals.\n\t- **Pings are visible in the fog as well**.\n\t- With the HD patch the frame rate is limited to your monitor's refresh rate. It can be switched off in the launcher and the HD menu.\n\t- Replays: \"Take over...\" lets you continue playing as that player from the current point. Adds a search and jumping to a time.\n\t- Modding: priestCount and smokePositions in BuildingInfo.xml.\n- Lobby:\n\t- Adds graphs to every single **statistic with a timeline (graph)**.\n\t- Adds a few new values to the endgame statistic - more on request.\n\t- Adds a Reload-button for scripts.\n\t- **Version check when joining**: the host only accepts exactly the same SU version, everyone else gets a message with the reason and both versions.\n\t- **Clear connection errors**: instead of the generic error the game names the cause and the solution. Right after the game start it keeps trying until the Ubisoft login is done.\n\t- The selected script is compared with the host's like a map and downloaded if it differs. You get asked before it is overwritten, declining leaves the lobby.\n- **Hotkey tool**: completely rewritten with readable names (DE, EN, PL), categories, filters, search, a keyboard view, one-click conflict solving and several keys per function. Saving no longer loses unknown entries.\n- UBO lobbies, chat level Cheating: \"!skip 5m\" fast-forwards, \"!skipto 1:30:00\" jumps to a game time, \"!skip stop\" cancels.\n\n\n# Changed\n- Hides the Debug Consoles at game start.\n- Implemented experimental changes (these are only enabled for UBO-TEST and Tournament lobbies):\n\t- Geologists: coarse precision radius 2 -> 3.\n- Lobby:\n\t- Empty / not set scripts are treated as Option 'Default' from now on.\n\t- DynamicGUI: rename @Key to @Var\n\t- Option 'Place Piles Outside': goods now land outside the whole area the building needs, so it can be rebuilt on exactly the same spot.\n\t- The invite window closes on a click outside of it.\n- Statistics graphs: **Ctrl** switches between total and per minute, hold **Shift** to see the other one. The highest value is now always on the top line.\n- HD menu: 'Game Speed' and 'Network Settings' are merged into 'Speed and Network', the new category 'Range Display' is added.\n- Hotkeys: unknown functions are skipped with a warning instead of stopping all hotkeys, e.g. for replays of older versions.\n- Logs: with automatic log upload enabled, errors during a game now trigger an upload when leaving the map, and a game report (session, game, play time per version) is sent. Failed uploads are retried. Zip and chat message of a desync only appear for the first one of a game.\n- Launcher:\n\t- Statistics now match the ones in the game and show up instantly. Own games can be posted to Discord from the match details.\n\t- Own games: delete several at once, the list no longer scrolls sideways.\n\t- Screenshots of statistics are off by default (can be enabled) and the tab opens faster. **Shift**+click marks a range, here and in own games.\n\t- Hovering the version shows its branch (Stable, Preview). Adds missing translations."}},"9":{"created":"2026-11-04T09:17:27.187Z","branch":"main","commit":"9ff371c","message":"update stable","text":{"default":"# Fixed\n- No FE but a warning instead if you join a game and do not have the correct map locally (see section Added for *Automatic Map and Script Exchange*).\n- Fixed a FE at the lobby screen when changing the balancing option.\n- Tutorial-events stayed active in lobby, leading to FEs when e.g. pressing space.\n- Better Chat Symbols: now working for initial messages as well.\n- **Ferry unloading**: checks properly for ground type, avoiding Entities being stuck on water.\n- Advanced Chat Commands are now properly sent and executed on every machine in parallel avoiding Desyncs (except for the explicit keyword 'local').\n- Fixed speed of entities on pathways, they were off by one.\n- Hotkeys keep working after changing player mid-game.\n- Rightclick now copies the proper chat message (it often took the wrong line).\n- SULib: SU.GameData.Set-Functions now clamp the parameter instead of modulo (e.g. 256 -> 255 instead of 0).\n\n\n# Added\n- Balancing-files are force-reloaded at every single map-start to prevent desyncs due to old settings (e.g. a player with who played UBO joins now UBO-Test).\n- Added CRC-checks inside the lobby and at game-start, checking all balancing relevant things (Maps, Files, Scripts, Settings) -> find mismatching settings before playing.\n- Invite-button: a menu shows up listing all your Ubisoft friends to directly invite them into your game.\n- Ferry instant unloader. Note that vehicles might still be in there, as they would usually be spawned at last (furthest away), which might not always be desired as they are kind of unprotected there - can be adjusted if wanted.\n- Saboteurs can attack Ports and Shipyards properly.\n- Spell 'Attack out of Nowhere' now prioritizes entities in the following order: (first) squadleader, swordman, racespecial, bowman, rest (last).\n\n- **Attack canceling fix**: damage is now always applied at the end of an animation, even when given a new movement command in the meantime.\n\n- **Workingarea for big temples** let priest go there automatically.\n\n- **Automatic Map and Script Exchange**: when you join a game, the map and script (internal and external ones!) are both checked and if not existent on your machine automatically downloaded directly from the host - no need to exchange any maps/scripts anymore!\n\n- **PioneerPath**: you can now let pioneers capture a path from A to B automatically. It's by design a bit wider than needed with some natural variations s.t. micromanaging is still quicker. You can start it **via GUI** or **Shift+rightclicking** the selected ones from their mean position the the mouse coordinate.\n\n- **Geologists variable precision**: you can define the precision (coarse, normal, fine) of geologists **via GUI** or by **Ctrl(coarse) / Shift(fine) + rightclicking**."}}},"releases":{"main":{"current":9,"versions":[{"version":9,"at":"2026-11-04T09:17:27.190Z"},{"version":1,"at":"2026-10-06T08:23:10.163Z"}]},"Preview":{"current":8,"versions":[{"version":8,"at":"2026-11-04T07:55:06.347Z"},{"version":7,"at":"2026-10-25T16:14:58.549Z"},{"version":6,"at":"2026-10-25T10:46:09.173Z"},{"version":5,"at":"2026-10-21T07:02:47.835Z"},{"version":4,"at":"2026-10-20T17:38:16.506Z"},{"version":3,"at":"2026-10-14T18:59:34.692Z"},{"version":2,"at":"2026-10-14T17:30:44.218Z"}]}},"seq":16,"updated":"2026-11-04T09:17:27.199Z"}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var tabsEl = document.getElementById('tabs'), listEl = document.getElementById('list');
  var qEl = document.getElementById('q'), langEl = document.getElementById('lang');
  var names = Object.keys(data.releases).sort(function (a, b) { return a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b); });
  var PALETTE = ['#fb8c00', '#1e88e5', '#8e24aa', '#d81b60', '#00897b', '#6d4c41', '#7cb342', '#5e35b1'];
  var color = function (n) { if (n === 'main') return '#43a047'; var o = names.filter(function (x) { return x !== 'main'; }).sort(); return PALETTE[Math.max(0, o.indexOf(n)) % PALETTE.length]; };
  var label = function (n) { return n === 'main' ? 'Stable' : n.charAt(0).toUpperCase() + n.slice(1); };
  var params = new URLSearchParams(location.search);
  var tab = params.get('release') || (names.indexOf('main') >= 0 ? 'main' : names[0]) || 'all';
  langEl.value = params.get('lang') || ((navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en');
  qEl.value = params.get('q') || '';
  var focus = (location.hash.match(/^#v(\d+)$/) || [])[1];

  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(langEl.value === 'de' ? 'de-DE' : 'en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function textOf(v) { var t = (data.versions[v] || {}).text || {}; return t[langEl.value] || t.default || t.en || t.de || ''; }
  function inline(parent, s) {
    s.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(function (part) {
      if (!part) return;
      var el = null;
      if (part.slice(0, 2) === '**' && part.slice(-2) === '**' && part.length > 4) { el = document.createElement('strong'); el.textContent = part.slice(2, -2); }
      else if (part[0] === '`' && part.slice(-1) === '`' && part.length > 2) { el = document.createElement('code'); el.textContent = part.slice(1, -1); }
      parent.appendChild(el || document.createTextNode(part));
    });
  }
  function markdown(parent, md) {
    var ul = null, p = null;
    md.split('\n').forEach(function (line) {
      var item = /^\s*[-*]\s+(.*)$/.exec(line);
      var head = /^#+\s+(.*)$/.exec(line);
      if (head) { ul = null; p = null; var h = document.createElement('h4'); inline(h, head[1]); parent.appendChild(h); return; }
      if (item) { p = null; if (!ul) { ul = document.createElement('ul'); parent.appendChild(ul); } var li = document.createElement('li'); inline(li, item[1]); ul.appendChild(li); }
      else if (!line.trim()) { ul = null; p = null; }
      else { ul = null; if (!p) { p = document.createElement('p'); parent.appendChild(p); } else p.appendChild(document.createElement('br')); inline(p, line.replace(/^#+\s*/, '')); }
    });
  }
  function rows() {
    if (tab === 'all') return Object.keys(data.versions).map(Number).sort(function (a, b) { return b - a; }).map(function (v) { return { version: v, at: data.versions[v].created }; });
    return ((data.releases[tab] || {}).versions || []);
  }
  function releasesOf(v) {
    return names.map(function (n) { var e = (data.releases[n].versions || []).filter(function (x) { return x.version === v; })[0]; return e ? { name: n, at: e.at } : null; })
      .filter(Boolean).sort(function (a, b) { return a.at.localeCompare(b.at); });
  }
  function render() {
    tabsEl.textContent = '';
    ['all'].concat(names).forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(n === tab));
      b.textContent = n === 'all' ? 'All versions' : label(n);
      if (n === 'all') b.className = 'all';
      b.onclick = function () { tab = n; render(); }; tabsEl.appendChild(b);
    });
    var q = qEl.value.trim().toLowerCase().replace(/^v/, '');
    listEl.textContent = '';
    var shown = 0;
    rows().forEach(function (r) {
      var v = data.versions[r.version] || {}, text = textOf(r.version);
      var haystack = (r.version + ' ' + (v.message || '') + ' ' + text).toLowerCase();
      if (q && haystack.indexOf(q) < 0) return;
      shown++;
      var art = document.createElement('article'); art.id = 'v' + r.version; if (String(r.version) === focus) art.className = 'hl';
      var h = document.createElement('h2'), a = document.createElement('a'); a.href = '#v' + r.version; a.textContent = 'Version ' + r.version; h.appendChild(a);
      var curOf = tab !== 'all' ? (data.releases[tab].current === r.version ? tab : null) : (names.filter(function (n) { return data.releases[n].current === r.version; })[0] || null);
      if (curOf) { art.className += (art.className ? ' ' : '') + 'cur'; art.style.setProperty('--cur', color(curOf)); }
      var meta = document.createElement('div'); meta.className = 'meta';
      var rel = releasesOf(r.version);
      rel.forEach(function (x) {
        var t = document.createElement('span'), now = data.releases[x.name].current === r.version;
        t.className = 'tag' + (now ? ' on' : ''); t.textContent = label(x.name);
        t.style.color = color(x.name); if (now) t.style.background = color(x.name);
        t.title = label(x.name) + (now ? ' (current) ' : ' (replaced) ') + fmt(x.at);
        meta.appendChild(t); meta.appendChild(document.createTextNode(fmt(x.at) + '  '));
      });
      if (!rel.length) meta.textContent = 'not released (built ' + fmt(v.created) + ')';
      art.appendChild(h); art.appendChild(meta);
      if (text) markdown(art, text); else if (v.message) { var m = document.createElement('p'); m.textContent = v.message; art.appendChild(m); }
      listEl.appendChild(art);
    });
    if (!shown) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No matching versions.'; listEl.appendChild(e); }
    if (focus) { var t = document.getElementById('v' + focus); if (t) t.scrollIntoView(); focus = null; }
  }
  if (focus) { var home = names.filter(function (n) { return releasesOf(Number(focus)).some(function (x) { return x.name === n; }); })[0]; if (home && !params.get('release')) tab = home; else if (!home) tab = 'all'; }
  qEl.oninput = render; langEl.onchange = render; window.onhashchange = function () { focus = (location.hash.match(/^#v(\d+)$/) || [])[1]; render(); };
  render();
})();
</script>
