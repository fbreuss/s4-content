<script type="application/json" id="data">{"format":1,"versions":{"1":{"created":"2026-10-06T08:23:10.163Z","branch":"main","commit":"177fde9","message":"Update Readme","text":{"default":"# A new era for Settlers 4 updates\n\nThe Settlers United mod files for Settlers IV now have a home of their own: balancing, plugin and everything that goes with it reach you **independently of the launcher** – no launcher update, no reinstall.\n\n# What changes for you\n\n- **Faster updates:** New balancing changes and plugin versions are there at your next start.\n- **Stable or Preview:** Select the version you like in \"Create new game\" and in the Launcher-settings (Settlers IV, Tools) and choose between 'stable' or 'preview' to test upcoming changes before everyone else.\n- **Secure:** All files are signed and verified before installation.\n- **Replays:** This update was needed as starting point to support Replays. When joining a game or playing a replay, the launcher automatically loads exactly the version it was played with – replays stay playable after future updates. This ist yet **work in progress** as a **debugging feature** for now. A nice user interface to load Replays will follow soon.\n\nThis is the starting shot. It's going to get exciting. 🚀"}},"2":{"created":"2026-10-14T09:58:19.378Z","branch":"preview","commit":"412fb71","message":"update preview","text":{"default":"# First Preview\nThis is a first test to see the system working."}},"3":{"created":"2026-10-14T18:59:34.690Z","branch":"Preview","commit":"4c3582d","message":"update preview","text":{"default":"# Second Preview\nFirst change here."}},"4":{"created":"2026-10-20T17:38:16.505Z","branch":"Preview","commit":"f60058d","message":"update preview","text":{"default":"Adds the HookRegistry: detects overlaps and address reusages as well as external hooks and patches based on a comparison to the local original unpatched exe."}},"5":{"created":"2026-10-21T07:02:47.834Z","branch":"Preview","commit":"5d4c661","message":"update preview","text":{"default":"Fix HookRegistry detections and DebugOverlay-crashes in combination with SU."}}},"releases":{"main":{"current":1,"versions":[{"version":1,"at":"2026-10-06T08:23:10.163Z"}]},"Preview":{"current":5,"versions":[{"version":5,"at":"2026-10-21T07:02:47.835Z"},{"version":4,"at":"2026-10-20T17:38:16.506Z"},{"version":3,"at":"2026-10-14T18:59:34.692Z"},{"version":2,"at":"2026-10-14T17:30:44.218Z"}]}},"seq":9,"updated":"2026-10-21T07:02:47.912Z"}</script>
